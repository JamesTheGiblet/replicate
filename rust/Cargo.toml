[package]
name = "replicant"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
rayon = "1.12"
ed25519-dalek = "3.0"
sha2 = "0.11"

[features]
default = ["std"]
std = []

[dev-dependencies]
rand = "0.8"
serde_json = "1.0"
