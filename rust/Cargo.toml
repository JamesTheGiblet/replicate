[package]
name = "replicant"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rand = { version = "0.10", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "wasm-bindgen"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Document", "Element", "Window", "CanvasRenderingContext2d", "HtmlCanvasElement"] }
getrandom = { version = "0.2", features = ["js"] }

[features]
default = ["std"]
std = []

[dev-dependencies]
rand = "0.10"
serde_json = "1.0"
